name: SSQ 数据自动更新

on:
  schedule:
    # 北京时间 = UTC+8。开奖日为周二/周四/周日 21:15 前后，
    # 这里在开奖日 13:00-15:00 UTC（21:00-23:00 北京时间）每 15 分钟检查一次
    - cron: '0,15,30,45 13-15 * * 0,2,4'
  workflow_dispatch:   # 支持在 GitHub 页面手动点「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行数据更新脚本
        run: python fetch_ssq.py

      - name: 有更新则提交并推送
        run: |
          git config user.name "ssq-auto-bot"
          git config user.email "ssq-auto-bot@users.noreply.github.com"
          git add ssq_data.json
          if git diff --cached --quiet; then
            echo "no data change, skip commit"
          else
            git commit -m "auto update ssq data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
